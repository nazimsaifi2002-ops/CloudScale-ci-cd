name: terraform-deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What should the robot do?"
        type: choice
        options:
          - apply
          - destroy
        default: apply

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4

      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Init
        run: terraform init -input=false

      - name: Create only the ECR repo
        if: ${{ inputs.action == 'apply' }}
        run: terraform apply -target=aws_ecr_repository.app -auto-approve -input=false

      - name: Log in to ECR
        if: ${{ inputs.action == 'apply' }}
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the image
        if: ${{ inputs.action == 'apply' }}
        run: |
          docker build -t ${{ steps.ecr.outputs.registry }}/cloudscale-app:v1 ./app
          docker push ${{ steps.ecr.outputs.registry }}/cloudscale-app:v1

      - name: Apply everything
        if: ${{ inputs.action == 'apply' }}
        run: terraform apply -auto-approve -input=false

      - name: Destroy
        if: ${{ inputs.action == 'destroy' }}
        run: terraform destroy -auto-approve -input=false
